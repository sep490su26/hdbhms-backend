server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 35MB
spring:
  application:
    name: hdbhms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB
  profiles:
    active: dev
  autoconfigure:
    exclude:
  #      - org.springframework.boot.autoconfigure.cache.JCacheCacheConfiguration
  main:
    allow-circular-references: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:${SMTP_MAIL_USERNAME:}}
    password: ${GMAIL_APP_PASSWORD:${SMTP_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cache:
    cache-names:
      - role-permissions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
twillio:
  account-sid: ${TWILLIO_ACCOUNT_SID}
  auth-token: ${TWILLIO_AUTH_TOKEN}
  from-number: ${TWILLIO_FROM_NUMBER}
esms:
  api-key: ${ESMS_API_KEY}
  secret-key: ${ESMS_SECRET_KEY}
  brand-name: ${ESMS_BRAND_NAME}
android_sms:
  server-address: ${ANDROID_SMS_GATEWAY_URL}
  username: ${ANDROID_SMS_GATEWAY_USERNAME}
  password: ${ANDROID_SMS_GATEWAY_PASSWORD}
app:
  jwt:
    secret: ${APP_JWT_SECRET:${SIGNER_KEY}}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  auth:
    token-secret: ${SIGNER_KEY}
    token-expiration-sec: 3600 #1h
    token-refresh-sec: 2592000 #30d
  default:
    owner:
      email: ${OWNER_EMAIL}
      phone: ${OWNER_PHONE}
      password: ${OWNER_PASSWORD}
      full-name: ${OWNER_FULL_NAME}
  file:
    storage:
      provider: ${FILE_STORAGE_PROVIDER:local}
      key-prefix: ${FILE_STORAGE_KEY_PREFIX:files}
      r2:
        endpoint: ${R2_ENDPOINT:}
        region: ${R2_REGION:auto}
        bucket: ${R2_BUCKET:}
        access-key-id: ${R2_ACCESS_KEY_ID:}
        secret-access-key: ${R2_SECRET_ACCESS_KEY:}
        path-style-access: ${R2_PATH_STYLE_ACCESS:true}
      supabase:
        url: ${SUPABASE_URL:}
        bucket: ${SUPABASE_STORAGE_BUCKET:files}
        service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:payos}
    payos:
      client-id: ${PAYOS_CLIENT_ID:${PAY_OS_CLIENT_ID:}}
      api-key: ${PAYOS_API_KEY:${PAY_OS_API_KEY:}}
      checksum-key: ${PAYOS_CHECKSUM_KEY:${PAY_OS_CHECKSUM_KEY:}}
      return-url: ${PAYOS_RETURN_URL:}
      cancel-url: ${PAYOS_CANCEL_URL:}
